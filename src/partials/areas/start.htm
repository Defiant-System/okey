<div class="start-view" data-area="start" data-context="start-menus">

	<h2>Choose Game</h2>

	<div class="logo" data-click="select-engine" data-arg="51">
		<svg><use xlink:href="#logo-51"></use></svg>
	</div>
	<div class="logo" data-click="select-engine" data-arg="101">
		<svg><use xlink:href="#logo-101"></use></svg>
	</div>

	<div class="logo" data-click="select-engine" data-arg="okey">
		<svg><use xlink:href="#logo-okey"></use></svg>
	</div>

	<h3>Opponents</h3>
	<ul class="players">
		<li>
			<div data-name="Yasmin"></div>
			<span>If you got the money, I got the time.</span>
		</li>
		<li>
			<div data-name="Sean"></div>
			<span>Give me your money.</span>
		</li>
		<li>
			<div data-name="Ann"></div>
			<span>I will buy new shoes with your money.</span>
		</li>
		<li>
			<div data-name="Denise"></div>
			<span>Just save your time - hand over your wallet.</span>
		</li>
		<li>
			<div data-name="Adam"></div>
			<span>This is my house.</span>
		</li>
		<li>
			<div data-name="Ali"></div>
			<span>Play big...play hard.</span>
		</li>
	</ul>

	<div class="tiles">
		<span class="tile red" data-v="1"></span>
		<span class="tile red" data-v="2"></span>
		<span class="tile red" data-v="3"></span>
		<span class="tile red" data-v="4"></span>
		<span class="tile red" data-v="5"></span>
		<span class="tile red" data-v="6"></span>
		<span class="tile red" data-v="7"></span>
		<span class="tile red" data-v="8"></span>
		<span class="tile red" data-v="9"></span>
		<span class="tile red" data-v="10"></span>
		<span class="tile red" data-v="11"></span>
		<span class="tile red" data-v="12"></span>
		<span class="tile red" data-v="13"></span>
	</div>

	<span class="button" data-click="show-dialog" data-arg="settings">Settings</span>

</div>
